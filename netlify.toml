# Netlify Configuration for HirePrep Frontend

[build]
  publish = "."
  command = "echo 'Building HirePrep Static Frontend... Ready!'"

# Redirect API calls to Render Backend with 200 Proxy
[[redirects]]
  from = "/api/*"
  to = "https://hirepreparation-backend.onrender.com/api/:splat"
  status = 200
  force = false
  headers = {X-From = "Netlify"}

# Security & CORS Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"
