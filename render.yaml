# Render Blueprint Configuration for HirePrep Backend
services:
  - type: web
    name: hireprep-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm --prefix server install
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://hiresmart.netlify.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
