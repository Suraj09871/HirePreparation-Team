<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Authentication - HireSmart</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <div style="background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 480px; border: 1px solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo justify-center" style="margin-bottom: 1rem;">
                <span class="logo-icon"></span>
                HireSmart
            </div>
            <h1 id="pageTitle" style="font-size: 1.5rem; margin-bottom: 0.5rem;">Join as a Student</h1>
            <p id="pageSubtitle" style="color: var(--text-muted); font-size: 0.875rem;">Create your profile to prepare and apply for jobs.</p>
        </div>

        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; background: var(--bg-muted); padding: 0.5rem; border-radius: 8px;">
            <button class="role-tab" data-role="student" style="flex: 1; padding: 0.5rem; border: none; background: white; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-weight: 500; cursor: pointer;">Student</button>
            <button class="role-tab" data-role="recruiter" style="flex: 1; padding: 0.5rem; border: none; background: transparent; color: var(--text-muted); font-weight: 500; cursor: pointer;" onclick="window.location.href='../recruiter/recruiter-auth.html'">Recruiter</button>
        </div>

        <div id="authError" class="error-message" style="display:none;"></div>

        <form id="authForm">
            <div id="nameField" class="form-group">
                <label>Full Name</label>
                <input type="text" id="authName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="authEmail" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">Create Account</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; position: relative;">
            <hr style="border: none; border-top: 1px solid var(--border-color);">
            <span style="position: absolute; top: -0.6rem; left: 50%; transform: translateX(-50%); background: white; padding: 0 1rem; color: var(--text-muted); font-size: 0.875rem;">Or</span>
        </div>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            <span id="toggleText">Already have an account?</span> <a href="#" id="toggleLink" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
        </div>
        <div style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
            <a href="../../index.html" style="color: var(--text-muted); text-decoration: none;">← Back to Home</a>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
</body>
</html>
