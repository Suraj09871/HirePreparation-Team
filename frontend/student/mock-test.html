<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test - HireSmart</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .test-setup { max-width: 600px; margin: 0 auto; }
        .test-active { max-width: 800px; margin: 0 auto; }
        .timer-bar { display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;background:white;border:1px solid var(--border-color);border-radius:12px;margin-bottom:1.5rem;justify-content:space-between; }
        .timer-display { font-size:1.5rem;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums; }
        .timer-bar.warning .timer-display { color:#ef4444; }
        .question-card { background:white;border:1px solid var(--border-color);border-radius:12px;padding:2rem;margin-bottom:1rem; }
        .question-card h3 { font-size:1rem;color:var(--text-main);margin-bottom:1.5rem;line-height:1.6; }
        .option-list { display:flex;flex-direction:column;gap:0.75rem; }
        .option-btn { padding:0.85rem 1.25rem;border:1.5px solid var(--border-color);border-radius:10px;background:white;cursor:pointer;font-size:0.9rem;transition:all 0.2s;text-align:left;display:flex;align-items:center;gap:0.75rem; }
        .option-btn:hover { border-color:var(--primary);background:rgba(249,115,22,0.03); }
        .option-btn.selected { border-color:var(--primary);background:rgba(249,115,22,0.08);font-weight:600; }
        .option-btn .opt-letter { width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:600;flex-shrink:0;transition:all 0.2s; }
        .option-btn.selected .opt-letter { background:var(--primary);color:white;border-color:var(--primary); }
        .q-nav { display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem; }
        .q-progress { display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.75rem; }
        .q-dot { width:28px;height:28px;border-radius:6px;border:1px solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:0.7rem;cursor:pointer;transition:all 0.2s;background:white; }
        .q-dot.answered { background:var(--primary);color:white;border-color:var(--primary); }
        .q-dot.current { border-color:var(--primary);box-shadow:0 0 0 2px rgba(249,115,22,0.3); }
        .result-card { text-align:center;padding:3rem;background:white;border-radius:16px;border:1px solid var(--border-color);max-width:500px;margin:0 auto; }
        .result-score { font-size:4rem;font-weight:800;background:linear-gradient(135deg,#f97316,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:1rem 0; }
    </style>
</head>
<body style="background:#f8fafc;">
    <nav class="navbar" style="border-bottom:1px solid var(--border-color);background:white;">
        <div class="logo"><span class="logo-icon"></span>HireSmart</div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="practice.html">Practice</a>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="#" class="active">Mock Test</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-outline" onclick="handleLogout()">↪ Sign Out</button>
        </div>
    </nav>

    <main class="container py-12" id="testContainer">
        <!-- Setup screen rendered by JS -->
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/mock-test.js"></script>
</body>
</html>
