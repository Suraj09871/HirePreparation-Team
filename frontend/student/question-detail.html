<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Detail - HireSmart</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../../js/theme.js"></script>
    <style>
        .split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: calc(100vh - 65px); }
        .left-panel { border-right: 1px solid var(--border-color); overflow-y: auto; display: flex; flex-direction: column; }
        .right-panel { display: flex; flex-direction: column; background: #1e1e2e; }
        .panel-tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--card-bg); }
        .panel-tab { padding: 0.85rem 1.5rem; font-weight: 500; font-size: 0.875rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; background: transparent; border-top: none; border-left: none; border-right: none; transition: all 0.2s; }
        .panel-tab:hover { color: var(--text-main); }
        .panel-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tag-pill { display: inline-flex; align-items: center; background: var(--bg-muted); border: 1px solid var(--border-color); padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; color: var(--text-main); font-weight: 500; }
        .company-pill { display: inline-flex; align-items: center; background: #e0f2fe; color: #0284c7; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; margin-right: 0.5rem; }
        [data-theme="dark"] .company-pill { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }
        .editor-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; background: #282a36; border-bottom: 1px solid #44475a; }
        .editor-toolbar select { padding: 0.35rem 0.75rem; border: 1px solid #44475a; border-radius: 6px; font-size: 0.8rem; background: #1e1e2e; color: #f8f8f2; }
        #aceEditor { flex: 1; width: 100%; font-size: 14px; }
        .editor-footer { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #282a36; border-top: 1px solid #44475a; }
        .output-panel { background: #1a1a2e; color: #a6e3a1; padding: 1rem; font-family: 'Fira Code', monospace; font-size: 0.8rem; max-height: 180px; overflow-y: auto; border-top: 1px solid #44475a; }
        .output-panel.error { color: #f38ba8; }
        .test-case { padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.5rem; background: var(--bg-muted); }
        .test-pass { border-left: 3px solid #10b981; }
        .test-fail { border-left: 3px solid #ef4444; }
        .submission-item { padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        @media (max-width: 900px) { .split-layout { grid-template-columns: 1fr; } .left-panel { max-height: 50vh; } }
    </style>
</head>
<body style="background: var(--bg-muted);">
    <nav class="navbar" style="padding: 0.75rem 5%; border-bottom: 1px solid var(--border-color);">
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='../../index.html'"><span class="logo-icon"></span> HireSmart</div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="practice.html" class="active">Practice</a>
            <a href="preparation.html">Preparation</a>
            <a href="student-dashboard.html">Dashboard</a>
        </div>
        <div class="nav-actions"></div>
    </nav>

    <div class="split-layout">
        <!-- Left: Problem Description -->
        <div class="left-panel">
            <div class="panel-tabs">
                <button class="panel-tab active" onclick="showLeftTab('description')">📝 Description</button>
                <button class="panel-tab" onclick="showLeftTab('testcases')">🧪 Test Cases</button>
                <button class="panel-tab" onclick="showLeftTab('submissions')">📊 Submissions</button>
            </div>
            <div id="descriptionTab" style="padding: 1.5rem; flex: 1; overflow-y: auto;">
                <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;">
                    <h1 id="question-title" style="font-size:1.35rem;margin:0;">Loading...</h1>
                    <span id="question-difficulty" style="font-size:0.75rem;background:rgba(249,115,22,0.1);color:var(--primary);padding:0.2rem 0.6rem;border-radius:999px;font-weight:600;">...</span>
                </div>
                <div id="question-tags" style="display:flex;gap:0.5rem;margin-bottom:1.5rem;"></div>
                <div id="question-description" style="color:var(--text-main);font-size:0.9rem;line-height:1.7;"></div>
                <div style="margin-top:2rem;background:rgba(249,115,22,0.05);border:1px solid rgba(249,115,22,0.2);border-radius:8px;padding:1.25rem;">
                    <h3 style="font-size:0.875rem;display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;"><span style="color:var(--primary);">🏢</span> Companies</h3>
                    <div id="question-companies"><span class="company-pill">...</span></div>
                </div>
            </div>
            <div id="testcasesTab" style="padding:1.5rem;display:none;overflow-y:auto;">
                <h3 style="margin-bottom:1rem;font-size:1rem;">Sample Test Cases</h3>
                <div id="testCasesList"></div>
            </div>
            <div id="submissionsTab" style="padding:1.5rem;display:none;overflow-y:auto;">
                <h3 style="margin-bottom:1rem;font-size:1rem;">Your Submissions</h3>
                <div id="submissionsList"><p style="color:var(--text-muted);text-align:center;padding:2rem;">No submissions yet. Write code and click Submit!</p></div>
            </div>
        </div>

        <!-- Right: Code Editor -->
        <div class="right-panel">
            <div class="editor-toolbar">
                <div style="display:flex;align-items:center;gap:0.75rem;">
                    <span style="color:#f8f8f2;font-weight:600;font-size:0.85rem;">💻 Code Editor</span>
                </div>
                <select id="langSelect" onchange="changeLang()">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="c_cpp">C++</option>
                </select>
            </div>
            <div id="aceEditor"></div>
            <div id="outputPanel" class="output-panel" style="display:none;"></div>
            <div class="editor-footer">
                <div style="display:flex;gap:0.75rem;">
                    <button onclick="runCode()" class="btn" style="background:#44475a;color:#f8f8f2;padding:0.5rem 1.25rem;font-size:0.85rem;">▷ Run</button>
                    <button onclick="submitCode()" class="btn" style="background:#50fa7b;color:#282a36;padding:0.5rem 1.25rem;font-size:0.85rem;font-weight:700;">↗ Submit</button>
                </div>
                <div style="font-size:0.7rem;color:#6272a4;display:flex;align-items:center;gap:0.5rem;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#50fa7b;"></span>
                    Simulated execution
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
    <script src="../../js/api.js"></script>
    <script>
    // Init Ace Editor
    const editor = ace.edit("aceEditor");
    editor.setTheme("ace/theme/dracula");
    editor.session.setMode("ace/mode/python");
    editor.setOptions({ fontSize: "14px", showPrintMargin: false, enableBasicAutocompletion: true });

    const templates = {
        python: '# Write your solution here\ndef solution(nums):\n    # Your code here\n    pass\n\n# Example usage:\n# print(solution([2, 7, 11, 15]))',
        javascript: '// Write your solution here\nfunction solution(nums) {\n    // Your code here\n    return null;\n}\n\n// Example usage:\n// console.log(solution([2, 7, 11, 15]));',
        java: 'class Solution {\n    public static void main(String[] args) {\n        // Your code here\n    }\n\n    public int solution(int[] nums) {\n        // Your code here\n        return 0;\n    }\n}',
        c_cpp: '#include <iostream>\n#include <vector>\nusing namespace std;\n\nint solution(vector<int>& nums) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    vector<int> nums = {2, 7, 11, 15};\n    cout << solution(nums) << endl;\n    return 0;\n}'
    };
    editor.setValue(templates.python, -1);

    function changeLang() {
        const lang = document.getElementById('langSelect').value;
        const modeMap = { python: 'python', javascript: 'javascript', java: 'java', c_cpp: 'c_cpp' };
        editor.session.setMode("ace/mode/" + modeMap[lang]);
        editor.setValue(templates[lang] || '', -1);
    }

    function showLeftTab(tab) {
        ['description','testcases','submissions'].forEach(t => { document.getElementById(t+'Tab').style.display = 'none'; });
        document.getElementById(tab+'Tab').style.display = 'block';
        document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
    }

    // Submissions history
    const submissions = JSON.parse(localStorage.getItem('hs_submissions') || '[]');

    function runCode() {
        const output = document.getElementById('outputPanel');
        output.style.display = 'block';
        output.className = 'output-panel';
        output.innerHTML = '⏳ Running code...';
        setTimeout(() => {
            const code = editor.getValue();
            if (code.includes('pass') || code.includes('return null') || code.includes('return 0')) {
                output.innerHTML = '⚠️ Output: None\n\nHint: Implement your solution logic before running.';
                output.className = 'output-panel error';
            } else {
                output.innerHTML = '✅ Code executed successfully!\n\n> Output: [Result would appear here]\n> Time: 12ms | Memory: 5.2MB';
            }
        }, 800);
    }

    function submitCode() {
        const output = document.getElementById('outputPanel');
        output.style.display = 'block';
        output.className = 'output-panel';
        output.innerHTML = '⏳ Running all test cases...';

        setTimeout(() => {
            const code = editor.getValue();
            const isEmpty = code.includes('pass') || code.includes('return null') || code.includes('return 0;') && code.length < 200;
            const passed = isEmpty ? 0 : Math.floor(Math.random() * 2) + 2;
            const total = 3;
            const status = passed === total ? 'Accepted' : 'Wrong Answer';

            output.innerHTML = `${status === 'Accepted' ? '🎉' : '❌'} ${status}\n\nTest Cases: ${passed}/${total} passed\nRuntime: ${Math.floor(Math.random()*50)+5}ms\nMemory: ${(Math.random()*5+3).toFixed(1)}MB`;
            output.className = status === 'Accepted' ? 'output-panel' : 'output-panel error';

            // Save submission
            const sub = { id: Date.now(), questionId: new URLSearchParams(window.location.search).get('id'), lang: document.getElementById('langSelect').value, status, passed, total, timestamp: new Date().toISOString() };
            submissions.unshift(sub);
            localStorage.setItem('hs_submissions', JSON.stringify(submissions.slice(0, 50)));
            updateSubmissionsUI();
            updateTestCasesUI(passed, total);
        }, 1200);
    }

    function updateTestCasesUI(passed, total) {
        const el = document.getElementById('testCasesList');
        el.innerHTML = '';
        for (let i = 0; i < total; i++) {
            const pass = i < passed;
            el.innerHTML += `<div class="test-case ${pass ? 'test-pass' : 'test-fail'}">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-weight:600;font-size:0.9rem;">Test Case ${i+1}</span>
                    <span style="font-size:0.8rem;font-weight:600;color:${pass?'#10b981':'#ef4444'};">${pass?'✓ Passed':'✕ Failed'}</span>
                </div>
                <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.5rem;">Input: [${i===0?'2, 7, 11, 15':i===1?'3, 2, 4':'1, 1, 1'}]</div>
                <div style="font-size:0.8rem;color:var(--text-muted);">Expected: ${i===0?'[0, 1]':i===1?'[1, 2]':'[0, 1]'}</div>
            </div>`;
        }
    }

    function updateSubmissionsUI() {
        const qId = new URLSearchParams(window.location.search).get('id');
        const qSubs = submissions.filter(s => s.questionId === qId);
        const el = document.getElementById('submissionsList');
        if (qSubs.length === 0) { el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem;">No submissions yet.</p>'; return; }
        el.innerHTML = qSubs.slice(0, 10).map(s => `
            <div class="submission-item">
                <div>
                    <div style="font-weight:600;font-size:0.9rem;color:${s.status==='Accepted'?'#10b981':'#ef4444'};">${s.status}</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">${s.lang.toUpperCase()} · ${new Date(s.timestamp).toLocaleString()}</div>
                </div>
                <span style="font-size:0.85rem;font-weight:600;">${s.passed}/${s.total}</span>
            </div>
        `).join('');
    }

    // Load question data (runs immediately - script is at end of body)
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const questionId = params.get('id');
        const questionType = params.get('type') || 'coding';

        console.log('[QDetail] questionId:', questionId, 'questionType:', questionType);

        if (!questionId) { document.getElementById('question-title').textContent = "Question Not Found"; return; }

        try {
            const response = await fetch('../../data/questions.json');
            console.log('[QDetail] fetch status:', response.status, response.ok);
            if (!response.ok) throw new Error("Failed to fetch");
            const data = await response.json();
            const arrayKey = questionType.toLowerCase().includes('mcq') ? 'coding_mcq' : questionType.toLowerCase() === 'aptitude' ? 'aptitude' : 'coding';
            const searchArray = data[arrayKey] || [];
            console.log('[QDetail] searching in:', arrayKey, 'array length:', searchArray.length);
            const question = searchArray.find(q => q.id === questionId);
            console.log('[QDetail] found question:', !!question);

            if (!question) { document.getElementById('question-title').textContent = "Question Not Found"; return; }

            document.getElementById('question-title').textContent = question.title;
            document.title = question.title + ' - HireSmart Practice';
            const diffEl = document.getElementById('question-difficulty');
            diffEl.textContent = question.difficulty;
            if (question.difficulty === "Easy") { diffEl.style.color = "#10b981"; diffEl.style.background = "rgba(16,185,129,0.1)"; }
            else if (question.difficulty === "Hard") { diffEl.style.color = "#ef4444"; diffEl.style.background = "rgba(239,68,68,0.1)"; }

            document.getElementById('question-companies').innerHTML = `<span class="company-pill">${question.company}</span>`;
            
            // Build tags from question data
            const tags = question.tags || (question.topic ? [question.topic] : []);
            document.getElementById('question-tags').innerHTML = tags.map(t => `<span class="tag-pill">${t}</span>`).join('') + 
                (question.acceptance ? `<span class="tag-pill" style="color:#10b981;">✓ ${question.acceptance}</span>` : '');

            // Build description from actual question data
            let descHtml = '<h3 style="font-size:1rem;margin-bottom:1rem;">Problem Statement</h3>';
            if (question.description) {
                descHtml += `<p style="margin-bottom:1rem;line-height:1.7;">${question.description}</p>`;
            } else if (question.question) {
                descHtml += `<p style="margin-bottom:1rem;line-height:1.7;">${question.question}</p>`;
            }

            // Show examples if available
            if (question.examples && question.examples.length > 0) {
                descHtml += '<h3 style="font-size:1rem;margin:1.5rem 0 0.75rem;">Examples</h3>';
                question.examples.forEach((ex, i) => {
                    descHtml += `<div style="background:var(--bg-muted);border:1px solid var(--border-color);border-radius:8px;padding:1rem;font-family:monospace;font-size:0.85rem;margin-bottom:0.75rem;">
                        <div style="font-weight:600;color:var(--text-muted);font-size:0.75rem;margin-bottom:0.5rem;">Example ${i+1}</div>
                        <div><strong>Input:</strong> ${ex.input}</div>
                        <div><strong>Output:</strong> ${ex.output}</div>
                        ${ex.explanation ? `<div style="color:var(--text-muted);margin-top:0.5rem;"><strong>Explanation:</strong> ${ex.explanation}</div>` : ''}
                    </div>`;
                });
            }

            // Show constraints if available
            if (question.constraints && question.constraints.length > 0) {
                descHtml += '<h3 style="font-size:1rem;margin:1.5rem 0 0.75rem;">Constraints</h3>';
                descHtml += '<ul style="padding-left:1.5rem;color:var(--text-muted);font-size:0.9rem;line-height:1.8;">';
                question.constraints.forEach(c => { descHtml += `<li>${c}</li>`; });
                descHtml += '</ul>';
            }

            // Show hints if available
            if (question.hints && question.hints.length > 0) {
                descHtml += `<div style="margin-top:1.5rem;background:rgba(249,115,22,0.05);border:1px solid rgba(249,115,22,0.15);border-radius:8px;padding:1.25rem;">
                    <h3 style="font-size:0.875rem;display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;"><span style="color:var(--primary);">💡</span> Hints</h3>`;
                question.hints.forEach((h, i) => {
                    descHtml += `<details style="margin-bottom:0.5rem;"><summary style="cursor:pointer;font-size:0.85rem;color:var(--primary);font-weight:500;">Hint ${i+1}</summary><p style="font-size:0.85rem;color:var(--text-muted);margin-top:0.5rem;padding-left:1rem;">${h}</p></details>`;
                });
                descHtml += '</div>';
            }

            document.getElementById('question-description').innerHTML = descHtml;

            // Init test cases display
            updateTestCasesUI(0, 3);
            updateSubmissionsUI();
        } catch (error) {
            document.getElementById('question-title').textContent = "Error Loading Question";
        }
    })();
    </script>
</body>
</html>
