<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Detail - HireSmart</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../../js/theme.js"></script>
    <style>
        body { background: var(--bg-muted); }
        .mcq-container { max-width: 800px; margin: 3rem auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); overflow: hidden; }
        .mcq-header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; }
        .mcq-body { padding: 2rem; }
        .mcq-footer { padding: 1.5rem 2rem; background: var(--bg-muted); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .tag-pill { display: inline-flex; align-items: center; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; color: #6366f1; font-weight: 500; margin-right: 0.5rem; margin-bottom: 0.5rem; }
        .company-pill { display: inline-flex; align-items: center; background: #e0f2fe; color: #0284c7; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; margin-right: 0.5rem; }
        [data-theme="dark"] .company-pill { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }
        .difficulty-badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 600; }
        
        .option-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .option-btn { padding: 1rem 1.5rem; border: 2px solid var(--border-color); border-radius: 12px; background: var(--card-bg); cursor: pointer; font-size: 1rem; transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 1rem; color: var(--text-main); }
        .option-btn:hover { border-color: var(--primary); background: rgba(249, 115, 22, 0.03); }
        .option-btn.selected { border-color: var(--primary); background: rgba(249, 115, 22, 0.08); font-weight: 600; }
        .option-btn.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .option-btn.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        
        .opt-letter { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; flex-shrink: 0; transition: all 0.2s; color: var(--text-muted); }
        .option-btn.selected .opt-letter { background: var(--primary); color: white; border-color: var(--primary); }
        .option-btn.correct .opt-letter { background: #10b981; color: white; border-color: #10b981; }
        .option-btn.wrong .opt-letter { background: #ef4444; color: white; border-color: #ef4444; }
        
        #result-message { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-weight: 500; display: none; }
        #result-message.success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        #result-message.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <nav class="navbar" style="padding: 0.75rem 5%; border-bottom: 1px solid var(--border-color); background: var(--card-bg);">
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='../../index.html'"><span class="logo-icon"></span> HireSmart</div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="practice.html" class="active">Practice</a>
            <a href="preparation.html">Preparation</a>
            <a href="student-dashboard.html">Dashboard</a>
        </div>
        <div class="nav-actions">
            <span id="themeToggle" onclick="toggleTheme()" style="font-size: 1.25rem; color: var(--text-muted); cursor: pointer;">☼</span>
        </div>
    </nav>

    <div class="container py-12">
        <a href="practice.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">← Back to Practice</a>
        
        <div class="mcq-container" id="mcq-container">
            <div style="padding: 4rem; text-align: center; color: var(--text-muted);">
                <div style="font-size: 2rem; margin-bottom: 1rem; animation: pulse 2s infinite;">⏳</div>
                Loading question...
            </div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script>
        let currentQuestion = null;
        let selectedOption = null;
        let hasSubmitted = false;
        
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const questionId = params.get('id');
            const questionType = params.get('type') || 'mcq';

            if (!questionId) {
                document.getElementById('mcq-container').innerHTML = '<div style="padding: 3rem; text-align: center; color: #ef4444;">Question ID is missing.</div>';
                return;
            }

            try {
                const response = await fetch('../../data/questions.json');
                const data = await response.json();
                let arrayKey = 'coding_mcq';
                if (questionType.toLowerCase() === 'aptitude') arrayKey = 'aptitude';
                const searchArray = data[arrayKey] || [];
                currentQuestion = searchArray.find(q => q.id === questionId);

                if (!currentQuestion) {
                    document.getElementById('mcq-container').innerHTML = '<div style="padding: 3rem; text-align: center; color: #ef4444;">Question not found.</div>';
                    return;
                }

                renderQuestion();
            } catch (e) {
                document.getElementById('mcq-container').innerHTML = '<div style="padding: 3rem; text-align: center; color: #ef4444;">Failed to load question.</div>';
            }
        })();

        function renderQuestion() {
            const q = currentQuestion;
            const diffColor = q.difficulty === 'Easy' ? '#10b981' : q.difficulty === 'Medium' ? '#f59e0b' : '#ef4444';
            const diffBg = q.difficulty === 'Easy' ? 'rgba(16,185,129,0.1)' : q.difficulty === 'Medium' ? 'rgba(245,158,11,0.1)' : 'rgba(239,68,68,0.1)';
            
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            const options = q.options || ['Option 1', 'Option 2', 'Option 3', 'Option 4'];
            
            const codeBlock = q.code ? `<div style="margin-top:1.5rem;background:#1e293b;color:#f8fafc;padding:1.5rem;border-radius:8px;font-family:monospace;font-size:0.9rem;white-space:pre-wrap;overflow-x:auto;position:relative;">
                ${q.language ? `<span style="position:absolute;top:0.5rem;right:0.5rem;background:rgba(255,255,255,0.1);padding:0.2rem 0.5rem;border-radius:4px;font-size:0.75rem;">${q.language}</span>` : ''}
                ${q.code}
            </div>` : '';

            document.getElementById('mcq-container').innerHTML = `
                <div class="mcq-header">
                    <div>
                        <div style="margin-bottom: 0.75rem;">
                            <span class="tag-pill">${q.type || 'Coding MCQ'}</span>
                            ${q.topic ? `<span class="tag-pill">${q.topic}</span>` : ''}
                            ${q.language ? `<span style="display:inline-flex;align-items:center;background:#f3f4f6;border:1px solid #d1d5db;padding:0.2rem 0.6rem;border-radius:6px;font-size:0.75rem;color:#374151;font-weight:600;margin-right:0.5rem;margin-bottom:0.5rem;">${q.language}</span>` : ''}
                        </div>
                        <h1 style="font-size: 1.5rem; margin: 0; color: var(--text-main); line-height: 1.4;">${q.title}</h1>
                    </div>
                    <div style="text-align: right;">
                        <span class="difficulty-badge" style="color: ${diffColor}; background: ${diffBg};">${q.difficulty}</span>
                        <div style="margin-top: 0.75rem;">
                            <span class="company-pill">${q.company || 'Multiple'}</span>
                        </div>
                    </div>
                </div>
                <div class="mcq-body">
                    ${codeBlock}
                    <div class="option-list" id="option-list">
                        ${options.map((opt, i) => `
                            <button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">
                                <span class="opt-letter">${letters[i]}</span>
                                <span>${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="result-message"></div>
                </div>
                <div class="mcq-footer">
                    <div style="color: var(--text-muted); font-size: 0.875rem;">
                        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-right: 0.5rem;"></span>
                        Practice Mode
                    </div>
                    <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()" disabled style="padding: 0.75rem 2rem; font-size: 1rem; opacity: 0.5; cursor: not-allowed;">Submit Answer</button>
                </div>
            `;
        }

        function selectOption(index) {
            if (hasSubmitted) return;
            selectedOption = index;
            
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`opt-${index}`).classList.add('selected');
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
        }

        function submitAnswer() {
            if (selectedOption === null || hasSubmitted) return;
            hasSubmitted = true;
            
            const q = currentQuestion;
            const correctIndex = q.correctAnswer !== undefined ? q.correctAnswer : 0; // fallback to 0 if not set
            const isCorrect = selectedOption === correctIndex;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.style.display = 'none'; // Hide submit button after submission
            
            const resultMsg = document.getElementById('result-message');
            resultMsg.style.display = 'block';
            
            // Mark correct answer
            document.getElementById(`opt-${correctIndex}`).classList.add('correct');
            
            // If selected is wrong, mark it wrong
            if (!isCorrect) {
                document.getElementById(`opt-${selectedOption}`).classList.add('wrong');
                resultMsg.className = 'error';
                resultMsg.innerHTML = '❌ <strong>Incorrect!</strong> The correct answer is ' + String.fromCharCode(65 + correctIndex) + '.';
            } else {
                resultMsg.className = 'success';
                resultMsg.innerHTML = '✅ <strong>Correct!</strong> Great job.';
            }
            
            if (q.explanation) {
                resultMsg.innerHTML += `<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(0,0,0,0.1);font-size:0.9rem;color:var(--text-main);line-height:1.5;"><strong>Explanation:</strong> ${q.explanation}</div>`;
            }
            
            // Disable all buttons
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.cursor = 'default';
                // Decrease opacity of unselected and incorrect options
                if (!btn.classList.contains('correct') && !btn.classList.contains('wrong')) {
                    btn.style.opacity = '0.5';
                }
            });
        }
    </script>
</body>
</html>
