<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login - HireSmart</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div style="background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 480px; border: 1px solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo justify-center" style="margin-bottom: 1rem;">
                <span class="logo-icon"></span>
                HireSmart <span style="font-size: 0.75rem; background: var(--bg-muted); padding: 0.2rem 0.5rem; border-radius: 4px; margin-left: 0.5rem; font-weight: normal; border: 1px solid var(--border-color); color: var(--text-muted);">Recruiter</span>
            </div>
            <h1 id="pageTitle" style="font-size: 1.5rem; margin-bottom: 0.5rem;">Recruiter Login</h1>
            <p id="pageSubtitle" style="color: var(--text-muted); font-size: 0.875rem;">Sign in to manage your job postings.</p>
        </div>

        <div id="authError" class="error-message" style="display:none;background:rgba(239,68,68,0.1);color:#ef4444;padding:0.75rem;border-radius:8px;text-align:center;margin-bottom:1rem;font-size:0.875rem;"></div>

        <form id="authForm">
            <div id="nameField" class="form-group" style="display:none;">
                <label style="display:block;font-size:0.875rem;font-weight:500;margin-bottom:0.5rem;">Company Name</label>
                <input type="text" id="authName" placeholder="Acme Corp" style="width:100%;padding:0.75rem;border:1px solid var(--border-color);border-radius:8px;">
            </div>
            <div class="form-group" style="margin-bottom:1.25rem;">
                <label style="display:block;font-size:0.875rem;font-weight:500;margin-bottom:0.5rem;">Email</label>
                <input type="email" id="authEmail" placeholder="hr@company.com" required style="width:100%;padding:0.75rem;border:1px solid var(--border-color);border-radius:8px;">
            </div>
            <div class="form-group" style="margin-bottom:1.25rem;">
                <label style="display:block;font-size:0.875rem;font-weight:500;margin-bottom:0.5rem;">Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required style="width:100%;padding:0.75rem;border:1px solid var(--border-color);border-radius:8px;">
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;padding:0.75rem;font-size:1rem;">Sign In</button>
        </form>

        <div style="margin-top:1.5rem;text-align:center;font-size:0.875rem;color:var(--text-muted);">
            <span id="toggleText">Don't have a recruiter account?</span> <a href="#" id="toggleLink" style="color:var(--primary);text-decoration:none;font-weight:600;">Sign Up</a>
        </div>
        <div style="margin-top:1rem;text-align:center;font-size:0.875rem;">
            <a href="../../index.html" style="color:var(--text-muted);text-decoration:none;">← Back to Home</a>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
</body>
</html>
