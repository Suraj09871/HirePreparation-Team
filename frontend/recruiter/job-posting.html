<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - HireSmart Recruiter</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: #f8fafc;">
    <nav class="navbar" style="border-bottom: 1px solid var(--border-color); background: white;">
        <div class="logo">
            <span class="logo-icon"></span>
            HireSmart <span style="font-size: 0.75rem; background: var(--bg-muted); padding: 0.2rem 0.5rem; border-radius: 4px; margin-left: 0.5rem; font-weight: normal; border: 1px solid var(--border-color); color: var(--text-muted);">Recruiter</span>
        </div>
        <div class="nav-links">
            <a href="recruiter-dashboard.html">Dashboard</a>
            <a href="#" class="active">Post a Job</a>
            <a href="applicant-list.html">Applicants</a>
            <a href="#">Company Profile</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-outline" onclick="handleLogout()"><span style="margin-right: 0.25rem;">↪</span> Sign Out</button>
        </div>
    </nav>

    <main class="container py-12">
        <div style="margin-bottom: 2rem;">
            <a href="recruiter-dashboard.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.5rem;">← Back to Dashboard</a>
        </div>

        <div style="max-width: 800px; margin: 0 auto; background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 2.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Create a Job Posting</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Fill out the details below to publish a new open position to the student network.</p>

            <form id="jobPostForm">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Job Title</label>
                    <input type="text" id="jobTitle" placeholder="e.g. Senior Frontend Developer" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Job Description</label>
                    <textarea id="jobDesc" placeholder="Describe the role, responsibilities, and team..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; min-height: 150px; font-family: 'Inter', sans-serif; resize: vertical;"></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Required Skills (comma separated)</label>
                        <input type="text" id="jobSkills" placeholder="React, Node.js, TypeScript" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;">
                    </div>
                    <div class="form-group">
                        <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Experience Required</label>
                        <select id="jobExp" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background: white;">
                            <option>0-1 years (Fresher)</option>
                            <option>1-3 years (Junior)</option>
                            <option>3-5 years (Mid-level)</option>
                            <option>5+ years (Senior)</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem;">
                    <div class="form-group">
                        <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Location</label>
                        <input type="text" id="jobLocation" placeholder="e.g. Remote, New York, Bangalore" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;">
                    </div>
                    <div class="form-group">
                        <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main);">Salary Range (Optional)</label>
                        <input type="text" id="jobSalary" placeholder="e.g. $120k - $150k" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;">
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                    <button type="button" id="saveDraftBtn" class="btn btn-outline" style="padding: 0.75rem 2rem;">Save as Draft</button>
                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Publish Job</button>
                </div>
            </form>
        </div>
    </main>
    <script src="../../js/api.js"></script>
    <script src="../../js/job-posting.js"></script>
</body>
</html>
